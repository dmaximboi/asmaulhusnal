<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com https://api.github.com; manifest-src 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asma Clock</title>
<meta name="description" content="Download Asma Clock for Android and Windows, or open it in the browser.">
<meta name="theme-color" content="#0b1211">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="land.css">
<script src="boot.js"></script>
</head>
<body>
<div class="wrap">
  <div class="face" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="47"></circle>
      <g class="ticks">
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(0 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(30 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(60 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(90 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(120 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(150 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(180 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(210 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(240 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(270 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(300 50 50)"></line>
        <line x1="50" y1="7" x2="50" y2="14" transform="rotate(330 50 50)"></line>
      </g>
      <line id="landHour" class="hour" x1="50" y1="50" x2="50" y2="28"></line>
      <line id="landMin" class="min" x1="50" y1="50" x2="50" y2="16"></line>
      <line id="landSec" class="sec" x1="50" y1="50" x2="50" y2="12"></line>
      <circle class="hub" cx="50" cy="50" r="3.2"></circle>
    </svg>
  </div>
  <h1 id="landTitle">Asma Clock</h1>
  <p class="lead" id="landLead">A quiet clock with the 99 Names, prayer times and a Hijri calendar.</p>
  <div class="langs">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="ar">ع</button>
  </div>
  <div class="actions" id="download">
    <a class="btn pri" id="dlApk" href="https://github.com/dmaximboi/asmaulhusnal/releases/latest/download/asma-clock.apk">Download Android</a>
    <a class="btn gold" id="dlWin" href="https://github.com/dmaximboi/asmaulhusnal/releases/latest/download/Asma-Island-Setup.exe">Download Windows</a>
    <a class="btn ghost" id="openApp" href="app.html">Open in this browser</a>
  </div>
  <p class="note" id="landHint">The phone and Windows files are one tap. After you open the clock in the browser, use the browser menu to install the web app on the home screen.</p>
  <p class="ver" id="landVer"></p>
</div>
<script src="land.js"></script>
<noscript><p class="note">JavaScript is required.</p></noscript>
</body>
</html>
